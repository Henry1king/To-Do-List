<!DOCTYPE html>
<html>
<head>
  <title>Task Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    input {
      padding: 8px;
      width: 70%;
    }

    button {
      padding: 8px 12px;
      margin-left: 5px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background: white;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1>My Tasks</h1>

  <input type="text" id="taskInput" placeholder="New task...">
  <button onclick="addTask()">Save Task</button>

  <ul id="taskList"></ul>

<script src="app.js"></script>
</body>
</html>
